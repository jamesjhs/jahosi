# Docker Compose configuration for Jahosi behind Traefik.
#
# This file is copied to the Debian host by GitHub Actions. The host does not
# build from source during deployment; it pulls the already-built image from
# GitHub Packages / GHCR using the `JAHOSI_IMAGE` value written into the generated
# server `.env` file.
#
# Expected branch/domain mapping:
#   BRANCH_NAME=main
#     SITE_URL=https://www.jahosi.co.uk
#     JAHOSI_TRAEFIK_RULE=Host(`jahosi.co.uk`) || Host(`www.jahosi.co.uk`)
#
#   BRANCH_NAME=testing
#     SITE_URL=https://www-test.jahosi.co.uk
#     JAHOSI_TRAEFIK_RULE=Host(`www-test.jahosi.co.uk`)
#
# SITE_URL is the app's canonical public URL. JAHOSI_TRAEFIK_RULE is generated
# by the workflow from the branch and SITE_URL because Docker Compose cannot
# parse a URL into a Traefik Host() expression by itself.
services:
  jahosi:
    # Deployment sets JAHOSI_IMAGE to an immutable SHA-tagged GHCR image, for
    # example `ghcr.io/owner/jahosi:<commit-sha>`. The local fallback lets you run
    # `docker compose build` or `docker compose up` on a developer machine.
    image: ${JAHOSI_IMAGE:-jahosi:local}

    # Local-build fallback. The production workflow still includes this block,
    # but remote deployment runs `docker compose pull` and `docker compose up
    # --no-build`, so the server uses the package image rather than rebuilding.
    build:
      context: .
      args:
        # Keep the container's internal app port at 3000. Traefik routes to this
        # internal port over the Docker network; no public host port is published.
        APP_PORT: ${PORT:-3000}

    # Branch-specific names allow main and testing containers to coexist on the
    # same Docker host.
    container_name: jahosi-${BRANCH_NAME:-main}
    restart: unless-stopped

    # Rotate container JSON logs so a quiet portfolio site cannot gradually fill
    # the server disk through normal access logs or unexpected error loops.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # The env file is generated by GitHub Actions for deployment. It is not baked
    # into the Docker image and should not contain source-controlled secrets.
    # `JAHOSI_ENV_FILE` exists for local validation, for example:
    #   JAHOSI_ENV_FILE=.env.example docker compose --env-file .env.example config
    env_file:
      - ${JAHOSI_ENV_FILE:-.env}

    # Persist SQLite analytics / app data outside the container. The branch suffix
    # keeps testing data away from production data.
    volumes:
      - ./persistent-data-${BRANCH_NAME:-main}:/app/data

    # Traefik must already be attached to this external Docker network on the
    # Debian host. Keeping Jahosi only on the proxy network means Traefik can
    # reach it without publishing container ports to the host.
    networks:
      - proxy

    labels:
      # Traefik reads these labels from Docker and creates a router/service pair
      # for this container.
      - "traefik.enable=true"

      # Route requests by Host header. The workflow generates this per branch:
      #   production: Host(`jahosi.co.uk`) || Host(`www.jahosi.co.uk`)
      #   testing:    Host(`www-test.jahosi.co.uk`)
      #
      # The `:?message` syntax makes Compose fail fast if a required deployment
      # variable is missing, instead of silently creating a broken Traefik route.
      - "traefik.http.routers.jahosi-${BRANCH_NAME:-main}.rule=${JAHOSI_TRAEFIK_RULE:?JAHOSI_TRAEFIK_RULE must be set}"

      # Tell Traefik which internal container port the Express server listens on.
      # This is always 3000 for Jahosi, but it is still read from PORT so the
      # generated server .env remains the single runtime source of truth.
      - "traefik.http.services.jahosi-${BRANCH_NAME:-main}.loadbalancer.server.port=${PORT:?PORT must be set}"

networks:
  proxy:
    # External means Compose must use an existing network instead of creating a
    # project-local network. Create it once on the server with:
    #   docker network create proxy
    # and attach Traefik to it.
    external: true
